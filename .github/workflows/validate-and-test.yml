name: Validate and test

on:
  pull_request:
  push:
    branches: [ main ]
    tags-ignore: [ v* ]

concurrency:
  # Only run once for latest commit per ref and cancel other (previous) runs.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting-check:
    name: Checks
    runs-on: ubuntu-latest
    if: github.repository == 'apache/pekko-http'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Scala on JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install sbt
        uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15

      - name: Cache Coursier cache
        uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1

      - name: Cache Build Target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: project/**/target
          key: build-target-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/**/*.scala') }}

      - name: Check code is formatted
        run: sbt checkCodeStyle

      - name: Check for missing formatting
        run: git diff --exit-code --color

      #- name: FOSSA policy check
      #  if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == 'apache/pekko-http' }}
      #  run: |-
      #    curl -H 'Cache-Control: no-cache' https://raw.githubusercontent.com/fossas/spectrometer/master/install.sh | bash
      #    fossa analyze && fossa test
      #  env:
      #    FOSSA_API_KEY: "${{secrets.FOSSA_API_KEY}}"

  compile-and-test:
    name: Compile and test
    runs-on: ubuntu-latest
    if: github.repository == 'apache/pekko-http'
    strategy:
      fail-fast: false
      matrix:
        SCALA_VERSION: [scala213, scala3, next]
        JDK: [17]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Identify root documentation-only pull requests
        id: pr_scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if python3 -I - <<'PY'
          import os
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args])

          def allowed_diff(before, after):
              # Treat both sides of a rename independently; allow only modified regular files.
              changes = git(
                  "diff", "--raw", "-z", "--no-renames", "--no-abbrev",
                  "--ignore-submodules=none", "--no-ext-diff", before, after
              ).split(b"\0")
              docs = {b"README.md", b"CONTRIBUTING.md"}
              return (
                  len(changes) >= 3
                  and len(changes) % 2 == 1
                  and changes[-1] == b""
                  and all(
                      re.fullmatch(rb":100644 100644 [0-9a-f]{40} [0-9a-f]{40} M", change)
                      and path in docs
                      for change, path in zip(changes[0:-1:2], changes[1:-1:2])
                  )
              )

          def docs_only():
              base = os.environ.get("BASE_SHA", "")
              head = os.environ.get("HEAD_SHA", "")
              merge = os.environ.get("GITHUB_SHA", "")
              if not all(re.fullmatch("[0-9a-f]{40}", sha) for sha in (base, head, merge)):
                  return False
              if git("rev-list", "--parents", "-n", "1", "HEAD").split() != [
                  sha.encode() for sha in (merge, base, head)
              ]:
                  return False
              if git("rev-parse", "--is-shallow-repository").strip() != b"false":
                  return False
              merge_bases = git("merge-base", "--all", base, head).split()
              if len(merge_bases) != 1 or not re.fullmatch(rb"[0-9a-f]{40}", merge_bases[0]):
                  return False

              # Require both the authored PR diff and the actual test tree delta to be docs-only.
              return allowed_diff(merge_bases[0].decode("ascii"), head) and allowed_diff(base, merge)

          try:
              raise SystemExit(0 if docs_only() else 1)
          except (OSError, subprocess.SubprocessError):
              raise SystemExit(1)
          PY
          then
            echo "skip_compile_all=true" >> "$GITHUB_OUTPUT"
            echo "Only root documentation was modified; skipping the unconditional Test/compile. PR validation still runs."
          fi

      - name: Set up JDK ${{ matrix.JDK }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.JDK }}

      - name: Install sbt
        uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15

      - name: Cache Coursier cache
        uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1

      - name: Cache Build Target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: project/**/target
          key: build-target-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/**/*.scala') }}

      - name: Enable jvm-opts
        run: cp .jvmopts-ci .jvmopts

      - name: Compile everything
        if: steps.pr_scope.outputs.skip_compile_all != 'true'
        run: |-
          scala_version="$(bash .github/scripts/resolve-scala-version.sh "${{ matrix.SCALA_VERSION }}")"
          sbt "++${scala_version}!" Test/compile

      # Quick testing for PR validation
      - name: Validate pull request for JDK ${{ matrix.JDK }}, Scala ${{ matrix.SCALA_VERSION }}
        if: ${{ github.event_name == 'pull_request' }}
        run: |-
          scala_version="$(bash .github/scripts/resolve-scala-version.sh "${{ matrix.SCALA_VERSION }}")"
          sbt -Dpekko.http.parallelExecution=false -Dpekko.test.timefactor=2 "++${scala_version}!" validatePullRequest

      # Full testing for pushes
      - name: Run all tests JDK ${{ matrix.JDK }}, Scala ${{ matrix.SCALA_VERSION }}
        if: ${{ github.event_name == 'push' }}
        run: |-
          scala_version="$(bash .github/scripts/resolve-scala-version.sh "${{ matrix.SCALA_VERSION }}")"
          if [ "${{ matrix.SCALA_VERSION }}" = "next" ]; then
            sbt -Dpekko.http.parallelExecution=false -Dpekko.test.timefactor=2 "++${scala_version}!" test
          else
            sbt -Dpekko.http.parallelExecution=false -Dpekko.test.timefactor=2 "++${scala_version}!" mimaReportBinaryIssues test
          fi

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()        # run this step even if previous step failed
        with:
          name: test-results-${{ matrix.JDK }}-${{ matrix.SCALA_VERSION }}
          path: '**/target/test-reports/*.xml'
