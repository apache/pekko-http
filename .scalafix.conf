// .scalafix.conf
rules = [
  RemoveUnused
  OrganizeImports
  ExplicitResultTypes
//  fix.scala213.NullaryOverride
]
//NullaryOverride.mode = Rewrite
ExplicitResultTypes {
  memberVisibility = [] # only rewrite implicit members
  skipSimpleDefinitions = []
}
ExplicitImplicitTypes.symbolReplacements {
  "scala/concurrent/ExecutionContextExecutor#" = "scala/concurrent/ExecutionContext#"
}
RemoveUnused.imports = false
RemoveUnused.privates = false
RemoveUnused.locals = false

//ignored files
// usually due them being used in our documentation - docs module is ignored anyway
// but some tests in other modules are also used used in the paradox build
ignored-files = [
  "CustomMediaTypesSpec.scala"
]

//ignored packages
ignored-packages = [
  "docs",
  "doc",
  "jdoc"
]

OrganizeImports {
  blankLines = Auto
  coalesceToWildcardImportThreshold = null
  expandRelative = false
  groupedImports = Keep
  // Resolve relative imports for grouping without expanding Pekko imports.
  groupSeparately = [ByTypeGivens]
  groups = [
    "re:javax?\\.",
    "scala.",
    "*",
    "com.sun.",
    "re:org\\.apache\\.pekko",
    "org.reactivestreams.",
    "io.netty.",
    "org.scalatest.",
    "org.slf4j.",
    "com.typesafe."
  ]
  importSelectorsOrder = Ascii
  importsOrder = Ascii
  removeUnused = true
  targetDialect = StandardLayout
}
